name: Build

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
        description:
          mode as expected by `gardener/cc-utils/.github/workflows/prepare`
          either of
          - snapshot
          - release

jobs:
  prepare:
    uses: gardener/cc-utils/.github/workflows/prepare.yaml@v1
    permissions:
      contents: read
      id-token: write
    with:
      mode: ${{ inputs.mode }}

  oci-image:
    name: Build OCI-Image
    uses: gardener/cc-utils/.github/workflows/oci-ocm.yaml@v1
    needs:
      - prepare
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      name: github-oidc-federation
      version: ${{ needs.prepare.outputs.version }}
      oci-registry: ${{ needs.prepare.outputs.oci-registry }}
      oci-repository: github-oidc-federation
      oci-platforms: linux/amd64
      extra-tags: latest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs:
      - prepare
    permissions:
      contents: read
    steps:
      - uses: gardener/cc-utils/.github/actions/trusted-checkout@v1
      - name: lint
        run: |
          pip3 install --break-system-packages ruff bandit

          blobs_dir=blobs.d
          mkdir $blobs_dir
          bandit_logfile=bandit.log
          bandit_evidence="${blobs_dir}/bandit.tar.gz"

          bandit_extra_args="-f txt -o ${bandit_logfile}" \
            .ci/lint

          tar czf $bandit_evidence $bandit_logfile pyproject.toml

      - uses: gardener/cc-utils/.github/actions/export-ocm-fragments@v1
        with:
          ocm-resources: |
            name: sast-linting-evidence
            relation: local
            access:
              type: localBlob
              localReference: bandit.tar.gz
            labels:
              - name: gardener.cloud/purposes
                value:
                  - lint
                  - sast
                  - pybandit
              - name: gardener.cloud/comment
                value: |
                  we use bandit (linter) for SAST scans
                  see: https://bandit.readthedocs.io/en/latest/
          blobs-directory: blobs.d

  helmchart:
    name: Build Helmchart
    uses: gardener/cc-utils/.github/workflows/helmchart-ocm.yaml@v1
    needs:
      - prepare
      - oci-image
      - lint
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      name: github-oidc-federation
      dir: charts/github-oidc-federation
      oci-registry: ${{ needs.prepare.outputs.oci-registry }}
      oci-repository: charts/github-oidc-federation
      ocm-mappings: |
        - ref: ocm-resource:github-oidc-federation.repository
          attribute: image.repository
        - ref: ocm-resource:github-oidc-federation.tag
          attribute: image.tag
