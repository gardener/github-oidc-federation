apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-oidc-federation
spec:
  replicas: 2
  selector:
    matchLabels:
      role: github-oidc-federation
  template:
    metadata:
      labels:
        role: github-oidc-federation
    spec:
      containers:
        - name: github-oidc-federation
          image: {{ include "image" .Values.image }}
          args:
            - --productive
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
          volumeMounts:
            - name: github-oidc-federation
              mountPath: /secrets
      volumes:
        - name: github-oidc-federation
          secret:
            secretName: github-oidc-federation
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              role: github-oidc-federation
