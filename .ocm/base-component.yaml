labels:
  - name: cloud.gardener.cnudie/responsibles
    value:
      - type: githubTeam
        teamname: gardener/ci-maintainers
        github_hostname: github.com
resources:
  - name: envoy-proxy
    version: 1.38.3
    type: ociImage
    relation: external
    access:
      type: ociRegistry
      imageReference: europe-docker.pkg.dev/gardener-project/releases/3rd/envoyproxy/envoy:distroless-v1.38.3
    labels:
      - name: gardener.cloud/cve-categorisation
        value:
          authentication_enforced: false
          availability_requirement: high
          confidentiality_requirement: high
          integrity_requirement: high
          network_exposure: public
          user_interaction: end-user
main-source:
  labels:
    - name: gardener.cloud/purposes
      value:
        - lint
        - sast
        - pybandit
    - name: gardener.cloud/comment
      value: |
        we use bandit (linter) for SAST scans
        see: https://bandit.readthedocs.io/en/latest/
